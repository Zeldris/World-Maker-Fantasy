<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Metric card: one big figure and a small bar chart drawn from the data below. Edit only the JSON in
     script#datos: "valor" is any number (the longest bar is the largest value) and "texto" is what is printed
     next to the bar. Three to six bars. Use real figures and give their source in ficha.md. Fill every other
     gap written between double braces. -->
<meta name="gw-size" content="1600x900">
<title>Minutos por banner en la Deck</title>
<style>
  :root {
    /* Palette: override these to match the project (brand colors, dark or light). Nothing else needs to change. */
    --fondo: #06121c; --superficie: #0c1d2b; --borde: #1b3447;
    --texto: #eaf4fa; --tenue: #9db4c4; --acento: #1aa6df; --acento-texto: #06121c;
    --bien: #4ade80; --mal: #f87171;
    --fuente: 'DejaVu Sans', 'Liberation Sans', sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; background: var(--fondo); color: var(--texto); font-family: var(--fuente);
         padding: 70px 86px; display: flex; flex-direction: column; }
  .marca { font-size: 24px; letter-spacing: .16em; text-transform: uppercase; color: var(--acento); font-weight: 700; }
  .cabecera { display: flex; align-items: flex-end; gap: 36px; margin-top: 24px; }
  .grande { white-space: nowrap; font-size: 128px; line-height: 1; font-weight: 800; color: var(--acento); }
  .grande-texto { font-size: 33px; line-height: 1.3; color: var(--tenue); padding-bottom: 14px; max-width: 900px; }
  #grafico { margin-top: auto; display: flex; flex-direction: column; gap: 18px; }
  .fila { display: grid; grid-template-columns: 330px 1fr 190px; align-items: center; gap: 24px; font-size: 27px; }
  .fila .et { color: var(--tenue); text-align: right; }
  .pista { height: 38px; background: var(--superficie); border: 2px solid var(--borde); border-radius: 8px; overflow: hidden; }
  .pista i { display: block; height: 100%; background: var(--acento); }
  .fila b { font-size: 30px; white-space: nowrap; }
  .pie { margin-top: 30px; font-size: 24px; color: var(--tenue); }
</style>
</head>
<body>
  <div class="marca">Tarkor · World-Maker-Fantasy</div>
  <div class="cabecera"><div class="grande">2,5 min</div><div class="grande-texto">por banner en una Steam Deck con la configuración que mejor salió: klein Q8, estilo cine2, 6 pasos</div></div>
  <div id="grafico"></div>
  <div class="pie">Minutos por banner de 1280×512 en la Steam Deck, semilla 3 · banco de calidad del 25 oct 2026, todavía en curso</div>
  <script type="application/json" id="datos">
  [
    {"etiqueta": "klein Q8, 6 pasos", "valor": 2.5, "texto": "~2,5 min"},
    {"etiqueta": "Z-Image Q4", "valor": 6, "texto": "~6 min"},
    {"etiqueta": "Z-Image Q6", "valor": 7, "texto": "~7 min"},
    {"etiqueta": "klein-base, cfg 3,5", "valor": 15, "texto": "15 min"}
  ]
  </script>
  <script>
    var datos = JSON.parse(document.getElementById("datos").textContent);
    var mayor = Math.max.apply(null, datos.map(function (d) { return d.valor; })) || 1;
    var grafico = document.getElementById("grafico");
    datos.forEach(function (d) {
      var fila = document.createElement("div");
      fila.className = "fila";
      var et = document.createElement("span");
      et.className = "et";
      et.textContent = d.etiqueta;
      var pista = document.createElement("div");
      pista.className = "pista";
      var barra = document.createElement("i");
      barra.style.width = Math.max(1, Math.round((d.valor / mayor) * 100)) + "%";
      pista.appendChild(barra);
      var texto = document.createElement("b");
      texto.textContent = d.texto;
      fila.appendChild(et);
      fila.appendChild(pista);
      fila.appendChild(texto);
      grafico.appendChild(fila);
    });
  </script>
</body>
</html>
