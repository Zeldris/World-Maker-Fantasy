<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de Helek Sirik</title>
<!-- MAP-5: visor local por capas de mundo/helek.json. Sin red: nada externo; lo sirve servir.py. -->
<style>
  :root { --fondo:#1b1d22; --panel:#262a31; --texto:#e6e2d8; --tenue:#9a9890; --borde:#3a3f48; --acento:#e0b04c; --mal:#e2685b; --ok:#7cc48a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--fondo); color:var(--texto); font:13px/1.4 system-ui, sans-serif; }
  #app { display:grid; grid-template-columns: 250px 1fr 290px; height:100%; }
  aside { background:var(--panel); padding:10px 12px; overflow:auto; border-color:var(--borde); border-style:solid; border-width:0 1px; }
  h1 { font-size:15px; margin:0 0 8px; } h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--tenue); margin:14px 0 6px; }
  label { display:flex; gap:6px; align-items:center; padding:2px 0; cursor:pointer; }
  .n { color:var(--tenue); margin-left:auto; font-size:11px; }
  button { background:#323741; color:var(--texto); border:1px solid var(--borde); border-radius:4px; padding:4px 8px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--acento); }
  .botones { display:flex; flex-wrap:wrap; gap:4px; }
  main { position:relative; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #escala { position:absolute; left:14px; bottom:14px; background:rgba(20,22,26,.8); padding:4px 8px; border-radius:4px; }
  #escala div { height:6px; border:2px solid var(--texto); border-top:0; margin-top:2px; }
  #regla { position:absolute; right:14px; bottom:14px; background:rgba(20,22,26,.8); padding:4px 8px; border-radius:4px; display:none; }
  #estado { position:absolute; left:50%; top:40%; transform:translateX(-50%); color:var(--tenue); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 8px; margin:0; } dt { color:var(--tenue); } dd { margin:0; }
  .muestra { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:4px; }
  table { border-collapse:collapse; width:100%; font-size:12px; } td { padding:2px 3px; border-top:1px solid var(--borde); vertical-align:top; }
  .ok { color:var(--ok); } .mal { color:var(--mal); } .ayuda { color:var(--tenue); font-size:12px; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Helek Sirik</h1>
    <div class="ayuda" id="fuente"></div>
    <h2>Capas</h2>
    <div id="capas"></div>
    <h2>Vista</h2>
    <div class="botones">
      <button data-vista="todo">Todo</button>
      <button data-vista="c3">Berig</button>
      <button data-vista="c2">Vaelira</button>
      <button id="mas">+</button><button id="menos">−</button>
    </div>
    <h2>Uso</h2>
    <p class="ayuda">Rueda: zoom. Arrastrar: mover. Clic: regla de distancia (dos clics); Esc la borra.
      Pasa el ratón para ver las medidas de la celda, su región, provincia y continente.</p>
  </aside>
  <main>
    <canvas id="lienzo"></canvas>
    <div id="estado">Cargando helek.json…</div>
    <div id="escala"><span id="escala-txt"></span><div id="escala-barra"></div></div>
    <div id="regla"></div>
  </main>
  <aside>
    <h2>Bajo el ratón</h2>
    <dl id="info"><dt>—</dt><dd>Pasa el ratón por el mapa.</dd></dl>
    <h2>Canon (±<span id="tol">3</span> %)</h2>
    <table id="canon"></table>
  </aside>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const lienzo = $('lienzo'), ctx = lienzo.getContext('2d');
const fmtNum = (v, d = 0) => v.toLocaleString('es-ES', { maximumFractionDigits: d, minimumFractionDigits: d });
const fmtKm = (v) => `${fmtNum(v)} km`;
const fmtKm2 = (v) => `${fmtNum(v)} km²`;

const CAPAS = [
  { id: 'relieve', nombre: 'Relieve', on: true },
  { id: 'biomas', nombre: 'Biomas', on: false },
  { id: 'regiones', nombre: 'Regiones', on: true },
  { id: 'provincias', nombre: 'Provincias', on: true },
  { id: 'costa', nombre: 'Costa', on: true },
  { id: 'rios', nombre: 'Ríos', on: true },
  { id: 'rutas', nombre: 'Rutas', on: true },
  { id: 'lugares', nombre: 'Lugares', on: true },
];
const RUTAS = { roads: ['#e8d7a8', 1.6, []], trails: ['#c9a774', 0.9, [3, 2]], searoutes: ['#a9c4e0', 0.9, [1, 3]] };

let M, MED, KM, celdas = [], porRegion = {}, porProv = {}, porCont = {}, porBioma = {};
let vista = { s: 1, x: 0, y: 0 }, raton = null, regla = [], arrastre = null, rejilla;

const sumaGrupo = (lista) => Object.fromEntries(lista.map((e) => [e.i, e]));

function areaCelda(c) {
  let a = 0;
  for (let k = 0; k < c.v.length; k++) {
    const [x0, y0] = M.vertices[c.v[(k + c.v.length - 1) % c.v.length]], [x1, y1] = M.vertices[c.v[k]];
    a += y0 * x1 - x0 * y1;
  }
  return Math.abs(a / 2) * KM * KM;
}

function colorRelieve(h) {
  if (h < 20) { const t = h / 19; return `rgb(${Math.round(24 + 50 * t)},${Math.round(52 + 70 * t)},${Math.round(92 + 80 * t)})`; }
  const paradas = [[20, [126, 166, 96]], [35, [178, 186, 110]], [50, [196, 160, 102]], [65, [150, 112, 82]], [80, [168, 160, 156]], [100, [246, 246, 246]]];
  for (let k = 1; k < paradas.length; k++) {
    const [h1, c1] = paradas[k], [h0, c0] = paradas[k - 1];
    if (h <= h1) { const t = (h - h0) / (h1 - h0); return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * t)).join(',')})`; }
  }
  return '#fff';
}

/* Aristas entre celdas: sirven para costa y fronteras (se dibuja solo donde cambia el atributo). */
function aristas() {
  const mapa = new Map();
  for (const c of M.celdas) {
    for (let k = 0; k < c.v.length; k++) {
      const a = c.v[k], b = c.v[(k + 1) % c.v.length], clave = a < b ? `${a},${b}` : `${b},${a}`;
      const e = mapa.get(clave);
      if (e) e.push(c.i); else mapa.set(clave, [a, b, c.i]);
    }
  }
  return [...mapa.values()];
}
let ARISTAS;
function trazoFrontera(atributo) {
  const p = new Path2D();
  for (const [a, b, i, j] of ARISTAS) {
    const ci = M.celdas[i], cj = j === undefined ? null : M.celdas[j];
    const vi = ci.h >= 20 ? atributo(ci) : 0, vj = cj && cj.h >= 20 ? atributo(cj) : 0;
    if (vi !== vj && (vi || vj)) { p.moveTo(...M.vertices[a]); p.lineTo(...M.vertices[b]); }
  }
  return p;
}

function preparar() {
  KM = M.fuente.kmPorUnidad;
  celdas = M.celdas.map((c) => {
    const p = new Path2D();
    c.v.forEach((v, k) => (k ? p.lineTo : p.moveTo).call(p, ...M.vertices[v]));
    p.closePath();
    return p;
  });
  porRegion = sumaGrupo(M.regiones); porProv = sumaGrupo(M.provincias); porCont = sumaGrupo(M.continentes); porBioma = sumaGrupo(M.biomas);
  ARISTAS = aristas();
  M._costa = trazoFrontera(() => 1);
  M._regiones = trazoFrontera((c) => c.region);
  M._provincias = trazoFrontera((c) => c.provincia);
  // Rejilla para encontrar la celda bajo el ratón (las celdas son de Voronoi: la del centro más cercano).
  const T = 20; rejilla = { T, cols: Math.ceil(M.fuente.ancho / T) + 1, cajas: new Map() };
  for (const c of M.celdas) {
    const k = Math.floor(c.p[0] / T) + Math.floor(c.p[1] / T) * rejilla.cols;
    (rejilla.cajas.get(k) || rejilla.cajas.set(k, []).get(k)).push(c);
  }
}

function celdaEn(x, y) {
  const { T, cols, cajas } = rejilla, cx = Math.floor(x / T), cy = Math.floor(y / T);
  let mejor = null, d = Infinity;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    for (const c of cajas.get(cx + dx + (cy + dy) * cols) || []) {
      const dd = (c.p[0] - x) ** 2 + (c.p[1] - y) ** 2;
      if (dd < d) { d = dd; mejor = c; }
    }
  }
  return mejor;
}

const activa = (id) => CAPAS.find((c) => c.id === id).on;

function dibujar() {
  const r = window.devicePixelRatio || 1, W = lienzo.clientWidth, H = lienzo.clientHeight;
  if (lienzo.width !== W * r || lienzo.height !== H * r) { lienzo.width = W * r; lienzo.height = H * r; }
  ctx.setTransform(r, 0, 0, r, 0, 0);
  ctx.fillStyle = '#16202c'; ctx.fillRect(0, 0, W, H);
  if (!M) return;
  ctx.setTransform(r * vista.s, 0, 0, r * vista.s, r * vista.x, r * vista.y);
  const px = 1 / vista.s;
  // FMG no guarda las celdas de mar profundo: el resto del rectángulo del mundo es mar abierto.
  ctx.fillStyle = activa('relieve') ? colorRelieve(0) : '#3b5f96'; ctx.fillRect(0, 0, M.fuente.ancho, M.fuente.alto);
  for (const c of M.celdas) {
    let color;
    if (c.h < 20) color = activa('relieve') ? colorRelieve(c.h) : '#466eab';
    else if (activa('biomas')) color = porBioma[c.bioma]?.color || '#888';
    else if (activa('relieve')) color = colorRelieve(c.h);
    else color = '#b9b39c';
    ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 0.5 * px;
    ctx.fill(celdas[c.i]); ctx.stroke(celdas[c.i]);
  }
  if (activa('regiones')) {
    ctx.globalAlpha = 0.35;
    for (const c of M.celdas) if (c.h >= 20 && porRegion[c.region]) { ctx.fillStyle = porRegion[c.region].color; ctx.fill(celdas[c.i]); }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#2a2320'; ctx.lineWidth = 1.6 * px; ctx.stroke(M._regiones);
  }
  if (activa('provincias')) {
    ctx.setLineDash([4 * px, 3 * px]); ctx.strokeStyle = '#3d2f2a'; ctx.lineWidth = 0.9 * px; ctx.stroke(M._provincias); ctx.setLineDash([]);
  }
  if (activa('costa')) { ctx.strokeStyle = '#1c2a38'; ctx.lineWidth = 1.2 * px; ctx.stroke(M._costa); }
  if (activa('rios')) {
    ctx.strokeStyle = '#4f8fd0'; ctx.lineWidth = 1.2 * px;
    for (const rio of M.rios) if (rio.puntos?.length) { ctx.beginPath(); rio.puntos.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke(); }
  }
  if (activa('rutas')) {
    for (const ru of M.rutas) {
      const [color, ancho, raya] = RUTAS[ru.grupo] || ['#ccc', 1, []];
      ctx.strokeStyle = color; ctx.lineWidth = ancho * px; ctx.setLineDash(raya.map((v) => v * px));
      ctx.beginPath(); ru.puntos.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  if (activa('lugares')) {
    ctx.font = `${12 * px}px system-ui, sans-serif`; ctx.textBaseline = 'middle';
    for (const lu of M.lugares) {
      ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(lu.x, lu.y, (lu.capital ? 4 : 3) * px, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f3e3b0'; ctx.beginPath(); ctx.arc(lu.x, lu.y, (lu.capital ? 2.5 : 1.8) * px, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 3 * px; ctx.strokeStyle = 'rgba(20,20,20,.75)'; ctx.strokeText(lu.nombre, lu.x + 6 * px, lu.y);
      ctx.fillStyle = '#f6efd9'; ctx.fillText(lu.nombre, lu.x + 6 * px, lu.y);
    }
  }
  if (raton?.celda) { ctx.strokeStyle = '#e0b04c'; ctx.lineWidth = 2 * px; ctx.stroke(celdas[raton.celda.i]); }
  if (regla.length) {
    const pts = raton && regla.length === 1 ? [...regla, [raton.x, raton.y]] : regla;
    ctx.strokeStyle = '#e0b04c'; ctx.lineWidth = 2 * px; ctx.setLineDash([6 * px, 4 * px]);
    ctx.beginPath(); pts.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke(); ctx.setLineDash([]);
    for (const [x, y] of regla) { ctx.fillStyle = '#e0b04c'; ctx.beginPath(); ctx.arc(x, y, 3 * px, 0, Math.PI * 2); ctx.fill(); }
    const d = pts.length === 2 ? Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]) * KM : 0;
    $('regla').style.display = 'block';
    $('regla').textContent = pts.length === 2 ? `Distancia: ${fmtNum(d, 1)} km` : 'Clic en el segundo punto';
  } else $('regla').style.display = 'none';
  escala();
}

function escala() {
  const objetivo = 120 / vista.s * KM, pot = 10 ** Math.floor(Math.log10(objetivo));
  const km = [1, 2, 5, 10].map((m) => m * pot).filter((v) => v <= objetivo).pop();
  $('escala-txt').textContent = fmtKm(km);
  $('escala-barra').style.width = `${km / KM * vista.s}px`;
}

function encuadrar(caja) {
  const [x0, y0, x1, y1] = caja || [0, 0, M.fuente.ancho, M.fuente.alto], W = lienzo.clientWidth, H = lienzo.clientHeight, m = 20;
  vista.s = Math.min((W - 2 * m) / (x1 - x0), (H - 2 * m) / (y1 - y0));
  vista.x = (W - (x1 - x0) * vista.s) / 2 - x0 * vista.s;
  vista.y = (H - (y1 - y0) * vista.s) / 2 - y0 * vista.s;
  dibujar();
}

function zoom(f, cx = lienzo.clientWidth / 2, cy = lienzo.clientHeight / 2) {
  const s = Math.min(60, Math.max(0.3, vista.s * f)); f = s / vista.s;
  vista.x = cx - (cx - vista.x) * f; vista.y = cy - (cy - vista.y) * f; vista.s = s; dibujar();
}

const aMundo = (ev) => { const b = lienzo.getBoundingClientRect(); return [(ev.clientX - b.left - vista.x) / vista.s, (ev.clientY - b.top - vista.y) / vista.s]; };

function filaMedida(nombre, color, m) {
  if (!m) return `<dd>${nombre}</dd>`;
  return `<dd><span class="muestra" style="background:${color}"></span>${nombre}<br>
    <span class="n">${fmtKm2(m.area)} · ${fmtNum(m.envolvente[0])} × ${fmtNum(m.envolvente[1])} km (E-O × N-S)</span></dd>`;
}

function info() {
  const c = raton?.celda;
  if (!c) { $('info').innerHTML = '<dt>—</dt><dd>Pasa el ratón por el mapa.</dd>'; return; }
  const tierra = c.h >= 20, filas = [
    `<dt>Punto</dt><dd>${fmtNum(raton.x * KM)} · ${fmtNum(raton.y * KM)} km</dd>`,
    `<dt>Celda</dt><dd>${c.i} · ${fmtKm2(areaCelda(c))}</dd>`,
    `<dt>Altura</dt><dd>${c.h} ${tierra ? '(tierra)' : '(mar)'}</dd>`,
  ];
  if (tierra) {
    const b = porBioma[c.bioma], co = porCont[c.continente], re = porRegion[c.region], pr = porProv[c.provincia];
    filas.push(`<dt>Bioma</dt><dd><span class="muestra" style="background:${b?.color}"></span>${b?.nombre ?? c.bioma}</dd>`);
    if (co) filas.push('<dt>Continente</dt>', filaMedida(co.nombre, '#b9b39c', MED.continentes[co.i]));
    if (re) filas.push('<dt>Región</dt>', filaMedida(re.nombre, re.color, MED.regiones[re.i]));
    if (pr) filas.push('<dt>Provincia</dt>', filaMedida(pr.nombre, pr.color, MED.provincias[pr.i]));
  }
  $('info').innerHTML = filas.join('');
}

function panelCanon() {
  const sujeto = (e) => e.region || e.continente || e.lugares.join(' ↔ ');
  const val = (v) => (Array.isArray(v) ? v.map((x) => fmtNum(x)).join(' × ') : fmtNum(v));
  $('canon').innerHTML = MED.canon.map((e) => `<tr><td class="${e.dentro ? 'ok' : 'mal'}">${e.dentro ? 'ok' : 'MAL'}</td>
    <td>${e.que} · ${sujeto(e)}<br><span class="n">${val(e.medido)} · canon ${'valor' in e ? val(e.valor) : e.rango.map(val).join('–')}</span></td></tr>`).join('');
}

function montarCapas() {
  const cuenta = { rios: M.rios.length, rutas: M.rutas.length, lugares: M.lugares.length, regiones: M.regiones.length, provincias: M.provincias.length };
  $('capas').innerHTML = CAPAS.map((c) => `<label><input type="checkbox" data-capa="${c.id}" ${c.on ? 'checked' : ''}>${c.nombre}${c.id in cuenta ? `<span class="n">${cuenta[c.id]}</span>` : ''}</label>`).join('');
  $('capas').addEventListener('change', (ev) => { CAPAS.find((c) => c.id === ev.target.dataset.capa).on = ev.target.checked; dibujar(); });
}

lienzo.addEventListener('wheel', (ev) => { ev.preventDefault(); const b = lienzo.getBoundingClientRect(); zoom(ev.deltaY < 0 ? 1.2 : 1 / 1.2, ev.clientX - b.left, ev.clientY - b.top); }, { passive: false });
lienzo.addEventListener('pointerdown', (ev) => { arrastre = { x: ev.clientX, y: ev.clientY, vx: vista.x, vy: vista.y, movido: false }; lienzo.setPointerCapture(ev.pointerId); });
lienzo.addEventListener('pointermove', (ev) => {
  if (!M) return;
  if (arrastre) {
    const dx = ev.clientX - arrastre.x, dy = ev.clientY - arrastre.y;
    if (Math.hypot(dx, dy) > 4) arrastre.movido = true;
    if (arrastre.movido) { vista.x = arrastre.vx + dx; vista.y = arrastre.vy + dy; }
  }
  const [x, y] = aMundo(ev);
  raton = { x, y, celda: x >= 0 && y >= 0 && x <= M.fuente.ancho && y <= M.fuente.alto ? celdaEn(x, y) : null };
  info(); dibujar();
});
lienzo.addEventListener('pointerup', (ev) => {
  if (arrastre && !arrastre.movido && M) { regla = regla.length === 1 ? [...regla, aMundo(ev)] : [aMundo(ev)]; dibujar(); }
  arrastre = null;
});
lienzo.addEventListener('pointerleave', () => { raton = null; info(); dibujar(); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { regla = []; dibujar(); } });
document.querySelectorAll('[data-vista]').forEach((b) => b.addEventListener('click', () => {
  const v = b.dataset.vista; encuadrar(v === 'todo' ? null : MED.continentes[v.slice(1)]?.caja);
}));
$('mas').addEventListener('click', () => zoom(1.4)); $('menos').addEventListener('click', () => zoom(1 / 1.4));
window.addEventListener('resize', dibujar);

Promise.all([fetch('helek.json').then((r) => r.json()), fetch('medidas.json').then((r) => r.json())]).then(([mundo, medidas]) => {
  M = mundo; MED = medidas;
  preparar(); montarCapas(); panelCanon();
  $('fuente').textContent = `${M.fuente.ancho} × ${M.fuente.alto} km · ${M.celdas.length} celdas · FMG ${M.fuente.fmg}`;
  $('estado').remove();
  encuadrar(MED.continentes['3']?.caja);
}).catch((e) => { $('estado').textContent = `No se pudo cargar el mapa: ${e.message}`; });
</script>
</body>
</html>
