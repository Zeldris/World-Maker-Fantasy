<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de imágenes</title>
<!-- CFG-43: interfaz local del generador de imágenes; la sirve servidor.py (image-generator/abrir.sh). -->
<style>
  :root { --fondo:#f6f4ef; --panel:#fff; --texto:#26231f; --suave:#6d665c; --borde:#ddd6ca; --acento:#8a5a2b;
          --acento-texto:#fff; --ok:#2f7a3d; --error:#a33a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#1b1916; --panel:#25221e; --texto:#ece6dc; --suave:#a59c8f; --borde:#3d3832; --acento:#c98a4b;
            --acento-texto:#1b1916; --ok:#6cc17a; --error:#e07a68; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto); font:15px/1.45 system-ui, sans-serif; }
  header { padding:12px 20px; border-bottom:1px solid var(--borde); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:18px; margin:0; }
  header span { color:var(--suave); font-size:13px; }
  main { display:grid; grid-template-columns:minmax(320px, 440px) 1fr; gap:20px; padding:20px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--borde); border-radius:8px; padding:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  label { display:block; font-size:13px; color:var(--suave); margin:10px 0 4px; }
  input, select, textarea, button { font:inherit; color:inherit; }
  input, select, textarea { width:100%; background:var(--fondo); border:1px solid var(--borde); border-radius:6px; padding:6px 8px; }
  textarea { resize:vertical; }
  #prompt { min-height:220px; font-family:ui-monospace, monospace; font-size:13px; }
  .fila { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .fila3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  button { border:1px solid var(--borde); background:var(--fondo); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.principal { background:var(--acento); color:var(--acento-texto); border-color:var(--acento); font-weight:600; width:100%; padding:10px; margin-top:14px; }
  button:disabled { opacity:.5; cursor:default; }
  #lista { max-height:180px; overflow:auto; border:1px solid var(--borde); border-radius:6px; margin-top:6px; }
  #lista div { padding:4px 8px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; gap:8px; }
  #lista div:hover { background:var(--fondo); }
  #lista small { color:var(--suave); }
  .nota-fuente { font-size:12px; color:var(--suave); margin-top:4px; }
  #estado { margin-top:12px; font-size:13px; white-space:pre-wrap; font-family:ui-monospace, monospace; color:var(--suave); }
  #estado.error { color:var(--error); }
  .barra-tanda { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .barra-tanda select { width:auto; }
  #galeria { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
  .tarjeta { border:1px solid var(--borde); border-radius:8px; overflow:hidden; background:var(--fondo); }
  .tarjeta.elegida { border-color:var(--ok); box-shadow:0 0 0 2px var(--ok) inset; }
  .tarjeta img { width:100%; display:block; background:#0002; cursor:zoom-in; }
  .tarjeta .sin-imagen { padding:30px; text-align:center; color:var(--error); font-size:13px; }
  .tarjeta .cuerpo { padding:10px; }
  .tarjeta .nombre { font-size:12px; font-family:ui-monospace, monospace; word-break:break-all; }
  .tarjeta .datos { font-size:12px; color:var(--suave); margin:4px 0 8px; }
  .tarjeta textarea { min-height:52px; font-size:13px; }
  .tarjeta .botones { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .tarjeta details { font-size:12px; margin-top:8px; }
  .tarjeta details pre { white-space:pre-wrap; font-size:12px; margin:6px 0 0; }
  .ok { color:var(--ok); font-size:12px; }
  #grande { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; cursor:zoom-out; }
  #grande img { max-width:96vw; max-height:96vh; }
</style>
</head>
<body>
<header><h1>Generador de imágenes</h1><span id="mundo"></span></header>
<main>
  <section>
    <h2>1 · Prompt</h2>
    <label for="buscar">Traer el prompt de una entidad (usado si lo hay, si no el base)</label>
    <input id="buscar" placeholder="busca por tipo o slug: fauna, nievon, banner…" autocomplete="off">
    <div id="lista" hidden></div>
    <div class="fila3">
      <div><label for="tipo">Tipo</label><input id="tipo" list="tipos" placeholder="fauna"><datalist id="tipos"></datalist></div>
      <div><label for="slug">Slug</label><input id="slug" placeholder="nievon"></div>
      <div><label for="perfil">Perfil</label><select id="perfil"></select></div>
    </div>
    <label for="prompt">Prompt (pégalo o edítalo)</label>
    <textarea id="prompt" spellcheck="false"></textarea>
    <div class="nota-fuente" id="fuente">Pegado</div>

    <h2 style="margin-top:18px">2 · Generar</h2>
    <div class="fila">
      <div><label for="semilla">Semilla</label>
        <div style="display:flex;gap:6px"><input id="semilla" type="number" value="42" min="0"><button id="azar" title="Semilla al azar">🎲</button></div></div>
      <div><label for="pasos">Pasos</label><input id="pasos" type="number" value="4" min="1" max="20"></div>
    </div>
    <div class="fila">
      <div><label for="referencia">Referencia de estilo</label><select id="referencia"><option value="">Ninguna</option></select></div>
      <div><label for="tanda">Tanda</label><input id="tanda" list="tandas"><datalist id="tandas"></datalist></div>
    </div>
    <button class="principal" id="generar">Generar imagen</button>
    <div id="estado"></div>
  </section>

  <section>
    <div class="barra-tanda"><h2 style="margin:0">3 · Tanda</h2><select id="verTanda"></select>
      <span class="nota-fuente">Nota de cada imagen → notas.md · «Elegir esta» → salida/images/&lt;tipo&gt;/&lt;slug&gt;-&lt;perfil&gt;.png</span></div>
    <div id="galeria"></div>
  </section>
</main>
<div id="grande"><img alt=""></div>
<script>
const $ = (id) => document.getElementById(id);
const TAMANOS = { banner: '1280×512', thumbnail: '768×768', mapa: '832×624', icono: '512×512' };
let entidades = [], cargado = null, sondeo = null;

async function api(ruta, cuerpo) {
  const r = await fetch(ruta, cuerpo === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(datos.error || `error ${r.status}`);
  return datos;
}
function hoy() { const d = new Date(); return d.toISOString().slice(0, 10); }
function aviso(texto, error) { $('estado').textContent = texto; $('estado').className = error ? 'error' : ''; }
function guardarFormulario() {
  try { localStorage.setItem('generador', JSON.stringify({ tipo: $('tipo').value, slug: $('slug').value, perfil: $('perfil').value,
    prompt: $('prompt').value, semilla: $('semilla').value, pasos: $('pasos').value, referencia: $('referencia').value, tanda: $('tanda').value })); } catch {}
}
function recuperarFormulario() {
  try { const f = JSON.parse(localStorage.getItem('generador') || 'null'); if (!f) return;
    for (const k of Object.keys(f)) if ($(k) && f[k] !== undefined) $(k).value = f[k]; } catch {}
}

function marcarFuente() {
  const igual = cargado && cargado.prompt === $('prompt').value && cargado.tipo === $('tipo').value && cargado.slug === $('slug').value && cargado.perfil === $('perfil').value;
  $('fuente').textContent = igual ? `Prompt ${cargado.fuente} de la enciclopedia (${cargado.tipo}/${cargado.slug}/${cargado.perfil})`
    : cargado ? 'Editado aquí: se generará con este texto (el registro dirá «pegado»)' : 'Pegado';
  return igual;
}

function pintarLista() {
  const q = $('buscar').value.trim().toLowerCase();
  if (!q) { $('lista').hidden = true; return; }
  const palabras = q.split(/\s+/);
  const hallados = entidades.filter((e) => palabras.every((p) => `${e.tipo} ${e.slug} ${e.perfil}`.includes(p))).slice(0, 60);
  $('lista').innerHTML = '';
  for (const e of hallados) {
    const d = document.createElement('div');
    d.innerHTML = `<span></span><small></small>`;
    d.firstChild.textContent = `${e.tipo} / ${e.slug}`;
    d.lastChild.textContent = `${e.perfil}${e.usado ? ' · usado' : ''}`;
    d.onclick = () => traer(e);
    $('lista').appendChild(d);
  }
  if (!hallados.length) $('lista').innerHTML = '<div><small>Sin coincidencias (¿generaste su prompt en la enciclopedia?)</small></div>';
  $('lista').hidden = false;
}

async function traer(e) {
  try {
    const r = await api(`/api/prompt?tipo=${encodeURIComponent(e.tipo)}&slug=${encodeURIComponent(e.slug)}&perfil=${encodeURIComponent(e.perfil)}`);
    $('tipo').value = e.tipo; $('slug').value = e.slug; $('perfil').value = e.perfil; $('prompt').value = r.prompt;
    cargado = { ...e, prompt: r.prompt, fuente: r.fuente };
    $('lista').hidden = true; $('buscar').value = '';
    marcarFuente(); guardarFormulario();
  } catch (err) { aviso(err.message, true); }
}

async function generar() {
  const desdeBase = marcarFuente();
  const peticion = { tanda: $('tanda').value.trim() || hoy(), tipo: $('tipo').value.trim(), slug: $('slug').value.trim(),
    perfil: $('perfil').value, prompt: $('prompt').value, desdeBase, semilla: Number($('semilla').value), pasos: Number($('pasos').value),
    referencia: $('referencia').value };
  $('tanda').value = peticion.tanda; guardarFormulario();
  try { await api('/api/generar', peticion); $('generar').disabled = true; aviso('Empezando…'); seguir(); }
  catch (err) { aviso(err.message, true); }
}

function seguir() {
  clearTimeout(sondeo);
  sondeo = setTimeout(async () => {
    let e;
    try { e = await api('/api/estado'); } catch (err) { aviso('El servidor no responde: ' + err.message, true); return; }
    if (e.enMarcha) {
      aviso(`${e.progreso} · ${e.segundos} s\n${e.salida.slice(-3).join('\n')}`);
      return seguir();
    }
    $('generar').disabled = false;
    if (e.rc === 0) aviso(`Hecha en ${e.segundos} s: ${e.nombre}`);
    else if (e.rc !== null && e.rc !== undefined) aviso(`Falló (salida ${e.rc}) tras ${e.segundos} s:\n${e.salida.join('\n')}`, true);
    await cargarTandas(e.tanda);
  }, 1500);
}

async function cargarTandas(elegir) {
  const ini = await api('/api/inicio');
  $('tandas').innerHTML = ini.tandas.map((t) => `<option value="${t}">`).join('');
  const sel = $('verTanda'), actual = elegir || sel.value || $('tanda').value || ini.tandas[0];
  sel.innerHTML = '';
  for (const t of ini.tandas) sel.add(new Option(t, t, false, t === actual));
  if (ini.tandas.length) await pintarTanda(sel.value);
  else $('galeria').innerHTML = '<p class="nota-fuente">Aún no hay tandas: genera la primera imagen.</p>';
}

async function pintarTanda(tanda) {
  const filas = await api(`/api/tanda?tanda=${encodeURIComponent(tanda)}`);
  const g = $('galeria'); g.innerHTML = '';
  if (!filas.length) g.innerHTML = '<p class="nota-fuente">Tanda vacía.</p>';
  for (const f of filas) {
    const t = document.createElement('div');
    t.className = 'tarjeta' + (f.elegida ? ' elegida' : '');
    t.innerHTML = `${f.imagen ? '<img loading="lazy" alt="">' : '<div class="sin-imagen"></div>'}
      <div class="cuerpo"><div class="nombre"></div><div class="datos"></div>
      <textarea placeholder="Qué te parece, qué sobra, qué falta…"></textarea>
      <div class="botones"><button class="elegir"></button><button class="usar">Usar este prompt</button><span class="ok"></span></div>
      <details><summary>Prompt</summary><pre></pre></details></div>`;
    if (f.imagen) {
      const img = t.querySelector('img'); img.src = `/img/${tanda}/${f.nombre}.png?${f.fecha}`;
      img.onclick = () => { $('grande').firstChild.src = img.src; $('grande').style.display = 'flex'; };
    } else t.querySelector('.sin-imagen').textContent = `Sin imagen (salida ${f.salida})`;
    t.querySelector('.nombre').textContent = f.nombre;
    t.querySelector('.datos').textContent = `${f.tipo}/${f.slug} · ${f.perfil} ${f.tamaño} · semilla ${f.semilla} · ${f.pasos} pasos · prompt ${f.prompt} · ${f.segundos} s${f.extra ? ' · ' + f.extra.replace(/.*\//, 'ref ') : ''}`;
    t.querySelector('pre').textContent = f.textoPrompt;
    const nota = t.querySelector('textarea'), ok = t.querySelector('.ok');
    nota.value = f.nota;
    nota.onchange = async () => { try { await api('/api/nota', { tanda, nombre: f.nombre, texto: nota.value }); ok.textContent = 'nota guardada'; } catch (err) { ok.textContent = err.message; } };
    const be = t.querySelector('.elegir');
    be.textContent = f.elegida ? '✓ Elegida' : 'Elegir esta'; be.disabled = !f.imagen;
    be.title = f.destino;
    be.onclick = async () => { try { const r = await api('/api/elegir', { tanda, nombre: f.nombre }); await pintarTanda(tanda); aviso(`Copiada a image-generator/${r.destino}`); } catch (err) { aviso(err.message, true); } };
    t.querySelector('.usar').onclick = () => {
      $('tipo').value = f.tipo; $('slug').value = f.slug; $('perfil').value = f.perfil; $('prompt').value = f.textoPrompt;
      $('semilla').value = f.semilla; $('pasos').value = f.pasos; cargado = null; marcarFuente(); guardarFormulario(); window.scrollTo(0, 0);
    };
    g.appendChild(t);
  }
}

async function iniciar() {
  const ini = await api('/api/inicio');
  $('mundo').textContent = `mundo ${ini.mundo} · las imágenes elegidas van a image-generator/salida/images/`;
  for (const p of ini.perfiles) $('perfil').add(new Option(`${p} (${TAMANOS[p]})`, p));
  for (const r of ini.referencias) $('referencia').add(new Option(r, r));
  $('tanda').value = hoy();
  recuperarFormulario();
  marcarFuente();
  try { entidades = await api('/api/entidades'); $('tipos').innerHTML = [...new Set(entidades.map((e) => e.tipo))].map((t) => `<option value="${t}">`).join(''); }
  catch (err) { aviso('Sin lista de entidades: ' + err.message, true); }
  await cargarTandas($('tanda').value);
  const e = await api('/api/estado');
  if (e.enMarcha) { $('generar').disabled = true; seguir(); }
}

$('buscar').oninput = pintarLista;
for (const id of ['prompt', 'tipo', 'slug', 'perfil']) $(id).addEventListener('input', () => { marcarFuente(); guardarFormulario(); });
for (const id of ['semilla', 'pasos', 'referencia', 'tanda']) $(id).addEventListener('change', guardarFormulario);
$('azar').onclick = () => { $('semilla').value = Math.floor(Math.random() * 1e6); guardarFormulario(); };
$('generar').onclick = generar;
$('verTanda').onchange = () => pintarTanda($('verTanda').value);
$('grande').onclick = () => { $('grande').style.display = 'none'; };
iniciar().catch((err) => aviso(err.message, true));
</script>
</body>
</html>
