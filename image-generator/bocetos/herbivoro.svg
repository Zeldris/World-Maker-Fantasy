<path d="M590 322 C572 340 580 372 604 376 C626 372 632 340 622 320Z M752 316 C734 336 742 370 766 374 C788 370 794 338 784 316Z" fill="#8a4222"/>
</g>
<!-- patas cercanas de ave: tarso larguisimo y fino, corvejon hacia atras, tres dedos con garra -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M606 330 L598 342 L630 388 L614 470" stroke="#d8c09a" stroke-width="11"/>
<path d="M768 328 L760 340 L792 386 L776 470" stroke="#d8c09a" stroke-width="11"/>
<path d="M614 470 L582 480 M614 470 L616 484 M614 470 L646 480 M776 470 L744 480 M776 470 L778 484 M776 470 L808 480" stroke="#d8c09a" stroke-width="8"/>
<path d="M582 480 L574 483 M616 484 L616 491 M646 480 L654 483 M744 480 L736 483 M778 484 L778 491 M808 480 L816 483" stroke="#2d241a" stroke-width="5"/>
</g>
<!-- cuello largo y fino, casi vertical -->
<path d="M588 284 C578 230 566 165 552 100 L572 98 C586 165 604 225 622 268Z" fill="#a85c36"/>
<path d="M560 104 L572 102 C588 165 604 215 614 255 C590 215 570 165 560 104Z" fill="#d8b890"/>
<!-- cabeza pequena a tres cuartos, hocico a la izquierda -->
<path d="M470 92 C480 72 520 64 552 72 C566 80 560 100 548 104 C520 110 490 108 474 100Z" fill="#b66a40"/>
<path d="M470 90 C464 96 466 102 474 100 L486 92Z" fill="#d8b890"/>
<ellipse cx="508" cy="82" rx="7" ry="5" fill="#2d241a"/>
<ellipse cx="474" cy="94" rx="5" ry="4" fill="#2d241a"/>
<!-- cuernos-hoja: dos laminas verdes grandes hacia los lados -->
<path d="M520 70 C450 28 340 18 240 54 C340 86 450 90 530 78Z" fill="#3f8a3a"/>
<path d="M256 55 C340 52 440 62 524 72" stroke="#2a6226" stroke-width="3" fill="none"/>
<path d="M552 68 C640 20 770 12 860 44 C770 82 640 86 562 78Z" fill="#3f8a3a"/>
<path d="M846 45 C760 46 650 56 556 72" stroke="#2a6226" stroke-width="3" fill="none"/>
</svg>
