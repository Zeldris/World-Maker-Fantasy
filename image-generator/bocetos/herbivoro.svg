<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="512" viewBox="0 0 1280 512">
<!-- Cuernahoja (IMG-18): esbelto y alto, cuello largo y fino casi vertical, cabeza pequena, cuernos-hoja verdes
     laterales, patas de ave (muslo corto, tarso larguisimo, corvejon hacia atras, pie de tres dedos). Escena de dia. -->
<defs><linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb8d8"/><stop offset="1" stop-color="#d8c8a8"/></linearGradient></defs>
<rect class="fondo" width="1280" height="512" fill="url(#cielo)"/>
<rect class="fondo" y="400" width="1280" height="112" fill="#8e3d24"/>
<ellipse class="sombra" cx="700" cy="478" rx="230" ry="14" fill="#4a1d12" opacity=".55"/>
<!-- patas lejanas (mas claras, algo mas cortas) -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M672 296 L664 336 L690 384 L676 466" stroke="#c9a878" stroke-width="9"/>
<path d="M836 294 L826 334 L852 382 L838 466" stroke="#c9a878" stroke-width="9"/>
<path d="M676 466 L650 474 M676 466 L678 478 M676 466 L702 474 M838 466 L812 474 M838 466 L840 478 M838 466 L864 474" stroke="#c9a878" stroke-width="6"/>
</g>
<g transform="translate(0 -40)">
<!-- cuerpo esbelto, lomo a ~57 % de la altura -->
<path d="M560 318 C570 282 690 272 800 284 C862 294 880 330 856 358 C800 382 640 380 586 366 C552 352 548 334 560 318Z" fill="#9a4a2a"/>
<path d="M596 360 C680 376 780 374 850 350 C800 388 650 388 596 360Z" fill="#d8b890"/>
