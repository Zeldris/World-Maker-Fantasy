<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="512" viewBox="0 0 1280 512">
<!-- Cuernahoja (IMG-18): esbelto y alto, cuello largo y fino casi vertical, cabeza pequena, cuernos-hoja color
     hueso con nervios (envergadura ~media altura del animal, banner GPT), patas de ave (muslo corto, tarso larguisimo, corvejon hacia atras, pie grande de tres dedos con garra). Cabeza girada a tres cuartos hacia quien
     mira (IMG-19c). Escena de dia. -->
<defs><linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb8d8"/><stop offset="1" stop-color="#d8c8a8"/></linearGradient></defs>
<rect class="fondo" width="1280" height="512" fill="url(#cielo)"/>
<rect class="fondo" y="400" width="1280" height="112" fill="#8e3d24"/>
<ellipse class="sombra" cx="700" cy="478" rx="230" ry="14" fill="#4a1d12" opacity=".55"/>
