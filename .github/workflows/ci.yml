name: CI

# Deuda técnica (2026-07-30, auditoría técnica: "sin CI ni git hooks"). Dos jobs independientes
# (backend con Prisma, frontend sin él); cada uno instala, tipa, lintea y testea su propio paquete.
#
# Hito 0.1, fase A (2026-09-29): el backend tiene además tests de integración con Postgres REAL
# (proyecto `bd-real` de Vitest, `*.integration.test.ts`), y la CI llevaba en rojo desde entonces
# ("Can't reach database server at localhost:5432"). Ahora el job levanta Postgres 16 con pgvector (el del runner, QA-28),
# aplica las migraciones, siembra el catálogo del mundo y arranca el Ollama simulado del repo
# (`tools/ci/mock-ollama.mjs`), igual que el entorno de pruebas local.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # QA-14 / QA-20 (retros del 2026-10-07): ninguna tarea sin hito, ningún identificador nuevo sin
  # definir y ninguna fase cerrada sin su retro.
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/roadmap/cobertura.py
      # QA-74: tests de las herramientas de tools/qa y de la parte del gancho de push que mira las ramas.
      - run: python3 -m unittest discover -s tools/qa/tests

  backend:
    runs-on: ubuntu-24.04  # QA-28: trae Postgres 16
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: 'postgresql://tarkor:tarkor@localhost:5432/tarkor'
      DIRECT_URL: 'postgresql://tarkor:tarkor@localhost:5432/tarkor'
      OLLAMA_BASE_URL: 'http://localhost:11434'
    steps:
      - uses: actions/checkout@v4
      # QA-28 (retro del 2026-10-09): Postgres del propio runner (ubuntu trae el 16) con pgvector por
      # apt, en vez de la imagen de Docker Hub, que sin cuenta topaba con el límite de descargas y
      # dejaba el job en rojo sin llegar a ejecutar un test (PR #36).
      - name: Postgres 16 con pgvector
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16-pgvector
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER tarkor WITH PASSWORD 'tarkor' SUPERUSER;"
          sudo -u postgres createdb -O tarkor tarkor
          for i in $(seq 1 20); do pg_isready -h localhost -U tarkor && exit 0; sleep 1; done
          echo "Postgres no arrancó" && exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Extensión pgvector
        run: PGPASSWORD=tarkor psql -h localhost -U tarkor -d tarkor -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - run: npx prisma migrate deploy
      # Antes que reindex-lore: los embeddings del RAG se piden a Ollama.
      - name: Ollama simulado
        run: |
          nohup node ../tools/ci/mock-ollama.mjs > /tmp/mock-ollama.out 2>&1 &
          for i in $(seq 1 20); do curl -s -o /dev/null localhost:11434 && exit 0; sleep 1; done
          echo "El Ollama simulado no arrancó" && cat /tmp/mock-ollama.out && exit 1
      # reindex-lore crea el mundo "helek-sirik" que seed-catalog necesita.
      - run: npm run reindex-lore
      - run: npm run seed-catalog
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
