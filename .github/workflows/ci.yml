name: CI

# Deuda técnica (2026-07-30, auditoría técnica: "sin CI ni git hooks"). Dos jobs independientes
# (backend con Prisma, frontend sin él); cada uno instala, tipa, lintea y testea su propio paquete.
#
# Hito 0.1, fase A (2026-09-29): el backend tiene además tests de integración con Postgres REAL
# (proyecto `bd-real` de Vitest, `*.integration.test.ts`), y la CI llevaba en rojo desde entonces
# ("Can't reach database server at localhost:5432"). Ahora el job levanta Postgres 16 con pgvector (el del runner, QA-28),
# aplica las migraciones, siembra el catálogo del mundo y arranca el Ollama simulado del repo
# (`tools/ci/mock-ollama.mjs`), igual que el entorno de pruebas local.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # QA-14 / QA-20 (retros del 2026-10-07): ninguna tarea sin hito, ningún identificador nuevo sin
  # definir y ninguna fase cerrada sin su retro.
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # QA-107: `bitacora.py --cerradas` compara con la base del PR
      - run: python3 tools/roadmap/cobertura.py
      # QA-101/QA-107: cada tarea cerrada de los hitos en prueba tiene su fila en la matriz de cobertura.
      - run: python3 tools/qa/matriz-pruebas.py --comprobar
      # QA-69/QA-85/QA-107: la bitácora (filas cortas, una por rama) y, en un PR, cada tarea tachada en un
      # roadmap también tachada en «Hecho recientemente». Antes solo lo miraba el pre-push.
      - run: python3 tools/qa/bitacora.py
      - if: github.event_name == 'pull_request'
        run: python3 tools/qa/bitacora.py --cerradas ${{ github.event.pull_request.base.sha }} HEAD
      # QA-107: ningún enlace relativo roto (archivo o ancla) en los .md.
      - run: python3 tools/qa/enlaces-md.py
      # QA-107: las herramientas de pruebas no se rompen sin que nadie lo vea hasta la ronda (sintaxis de los
      # .sh, los .mjs y las ayudas de mcp/; historico/ son scripts archivados que no se ejecutan).
      - name: Sintaxis de las herramientas
        run: |
          for f in $(git ls-files '*.sh' .githooks); do bash -n "$f" || exit 1; done
          for f in $(git ls-files 'tools/**/*.mjs' | grep -v /historico/); do node --check "$f" || exit 1; done
          for f in tools/playwright-e2e/mcp/*.js; do node -e "new Function('return (' + require('fs').readFileSync('$f', 'utf8') + ')')" || { echo "$f"; exit 1; }; done
          python3 -m py_compile $(git ls-files 'tools/**/*.py' '.claude/skills/**/*.py')
      # QA-74: tests de las herramientas de tools/qa y de la parte del gancho de push que mira las ramas.
      - run: python3 -m unittest discover -s tools/qa/tests
      # QA-84: el resumen de la cabecera de cada registro de hallazgos de hito coincide con su tabla.
      - run: for r in docs/registros/pruebas-[0-9]*-hallazgos.md; do python3 tools/qa/marca-hallazgo.py --resumen --comprobar --registro "$r" || exit 1; done

  backend:
    runs-on: ubuntu-24.04  # QA-28: trae Postgres 16
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: 'postgresql://tarkor:tarkor@localhost:5432/tarkor'
      DIRECT_URL: 'postgresql://tarkor:tarkor@localhost:5432/tarkor'
      OLLAMA_BASE_URL: 'http://localhost:11434'
    steps:
      - uses: actions/checkout@v4
      # QA-28 (retro del 2026-10-09): Postgres del propio runner (ubuntu trae el 16) con pgvector por
      # apt, en vez de la imagen de Docker Hub, que sin cuenta topaba con el límite de descargas y
      # dejaba el job en rojo sin llegar a ejecutar un test (PR #36).
      - name: Postgres 16 con pgvector
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16-pgvector
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER tarkor WITH PASSWORD 'tarkor' SUPERUSER;"
          sudo -u postgres createdb -O tarkor tarkor
          for i in $(seq 1 20); do pg_isready -h localhost -U tarkor && exit 0; sleep 1; done
          echo "Postgres no arrancó" && exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Extensión pgvector
        run: PGPASSWORD=tarkor psql -h localhost -U tarkor -d tarkor -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - run: npx prisma migrate deploy
      # QA-107: el esquema y las migraciones dicen lo mismo (un cambio en schema.prisma sin su migración rompería
      # las partidas al desplegar).
      - name: Esquema sin migración pendiente
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      # Antes que reindex-lore: los embeddings del RAG se piden a Ollama.
      - name: Ollama simulado
        run: |
          nohup node ../tools/ci/mock-ollama.mjs > /tmp/mock-ollama.out 2>&1 &
          for i in $(seq 1 20); do curl -s -o /dev/null localhost:11434 && exit 0; sleep 1; done
          echo "El Ollama simulado no arrancó" && cat /tmp/mock-ollama.out && exit 1
      # reindex-lore crea el mundo "helek-sirik" que seed-catalog necesita.
      - run: npm run reindex-lore
      - run: npm run seed-catalog
      - run: npm test
      # QA-102/QA-107: cada escenario de pruebas guardado se restaura y acepta las migraciones de ahora.
      - name: Escenarios de pruebas
        working-directory: .
        run: bash tools/qa/comprobar-escenarios.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # QA-107: `build` es `tsc -b` y el empaquetado de Vite: lo que solo falla al empaquetar también se ve.
      - run: npm run build
      - run: npm test
