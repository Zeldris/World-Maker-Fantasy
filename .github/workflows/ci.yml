name: CI

# Deuda técnica (2026-07-30, auditoría técnica: "sin CI ni git hooks — oxlint pasando en local y
# los tests de ruta nuevos no se hacen cumplir en push/PR"). Dos jobs independientes (backend con
# Prisma, frontend sin él) — cada uno instala, tipa, lintea y testea su propio paquete. Ninguno
# necesita una base de datos real: todos los tests mockean Prisma (`vi.mock('.../lib/prisma.js')`)
# — `DATABASE_URL`/`DIRECT_URL` aquí son valores de relleno solo para que `env.ts` no reviente al
# arrancar y para que `prisma generate` tenga un schema válido que leer.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: 'postgresql://user:pass@localhost:5432/tarkor_ci'
      DIRECT_URL: 'postgresql://user:pass@localhost:5432/tarkor_ci'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
